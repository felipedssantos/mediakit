[package]
name = "conversor"
version = "0.1.0"
description = "Windows desktop app for local video/image compression, conversion, and media downloads"
authors = ["Felipe Dumont"]
license = "MIT"
repository = "https://github.com/felipedssantos/conversor"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "conversor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "image-ico"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.3.6"
tauri-plugin-dialog = "2.7.3"
uuid = { version = "1.26.0", features = ["v4"] }
xcap = "0.9"
image = "0.25"
arboard = "3"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
webp = "0.3"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
