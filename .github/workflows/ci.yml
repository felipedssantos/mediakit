name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  checks:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run frontend unit tests
        run: npx vitest run

      - name: Build frontend
        run: npm run build

      - name: Create placeholder sidecar binaries for tauri_build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          foreach ($name in @(
            "ffmpeg-x86_64-pc-windows-msvc.exe",
            "ffprobe-x86_64-pc-windows-msvc.exe",
            "yt-dlp-x86_64-pc-windows-msvc.exe"
          )) {
            $path = Join-Path src-tauri/binaries $name
            if (-not (Test-Path $path)) {
              New-Item -ItemType File -Path $path | Out-Null
            }
          }

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test

  linux-checks:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            libayatana-appindicator3-dev \
            libclang-dev \
            libdbus-1-dev \
            libdrm-dev \
            libgbm-dev \
            libpipewire-0.3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxcb1-dev \
            libxdo-dev \
            libxrandr-dev \
            pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies and build frontend
        run: npm ci && npm run build

      - name: Create placeholder Linux sidecar binaries for tauri_build
        run: |
          mkdir -p src-tauri/binaries
          for name in \
            ffmpeg-x86_64-unknown-linux-gnu \
            ffprobe-x86_64-unknown-linux-gnu \
            yt-dlp-x86_64-unknown-linux-gnu; do
            touch "src-tauri/binaries/$name"
            chmod +x "src-tauri/binaries/$name"
          done

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test
