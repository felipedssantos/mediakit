name: Bug report
description: Report an unexpected error or broken behavior in Conversor
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can maintainers reproduce the issue?
      placeholder: |
        1. Open Conversor
        2. Drop a file / paste a URL
        3. Select preset '...'
        4. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 0.1.0 or commit hash
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version & GPU (if relevant)
      placeholder: e.g. Windows 11 24H2 / RTX 3060
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Error message or logs
      description: Paste any error message shown in the UI or terminal output.
      render: text
